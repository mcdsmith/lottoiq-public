[build]
  command = "npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"

# --- Legacy Wix URLs -> new site -------------------------------------------
# Wix served posts at /post/<slug>. Netlify can't test whether a target page
# exists, so each current post gets its own explicit rule (generated from
# src/posts/*.md -- add a line here when a post is added whose Wix URL was
# ever public). Anything else under /post/ falls back to the blog index.

[[redirects]]
  from = "/post/backtesting-due-score"
  to = "/blog/backtesting-due-score/"
  status = 301

