[build]
  command = "npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"

# --- Legacy Wix URLs -> new site -------------------------------------------
# Wix served posts at /post/<slug>. Slugs that match a new post redirect 1:1
# (add specific lines ABOVE the catch-all as the URL audit turns them up);
# anything else lands on the blog index instead of a 404.
[[redirects]]
  from = "/post/:slug"
  to = "/blog/:slug/"
  status = 301

[[redirects]]
  from = "/blog-1"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog-feed.xml"
  to = "/blog/"
  status = 301

# Old pre-merge blog location
[[redirects]]
  from = "/posts/*"
  to = "/blog/:splat"
  status = 301
